# Publicerar dagens godkända artikel varje morgon, utan att Andreas dator behöver vara på.
# Artiklarna ligger i _kalla/godkanda/ (dit kopierar _kalla/synka.py dem när Andreas har godkänt). Bygget tar bara med
# artiklar vars datum har kommit; blir sidorna annorlunda committas de, och Cloudflare lägger ut sajten.
name: Publicera artiklar
on:
  schedule:
    # GitHub startar schemalagda jobb ofta flera timmar sent (8 nov: 06:00 blev 12:38), så första försöket görs strax
    # efter midnatt svensk tid och ett till på morgonen. Har artikeln redan publicerats gör det andra ingenting.
    - cron: '17 23 * * *'  # 00:17 vintertid, 01:17 sommartid
    - cron: '17 3 * * *'   # 04:17 vintertid, 05:17 sommartid
  workflow_dispatch:
permissions:
  contents: write
concurrency: publicera
jobs:
  publicera:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Stockholm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Samma versioner som på datorn, annars blir HTML och bilder olika och varje bygge en ny commit.
      - run: pip install markdown==3.10.2 Pillow==12.0.0
      - run: python3 _kalla/bygg.py
      - name: Commit och push
        run: |
          git add -A
          if git diff --cached --quiet; then echo "Inget nytt att publicera."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Publicera artiklar $(date +%F)"
          git push
      # Cloudflare har en gång låtit bli att bygga en commit (3903fe4, 12 nov), så artikeln fanns i repot men inte på
      # sajten. Svarar någon sida i sitemapen inte 200 startas ett nytt bygge med en tom commit.
      - name: Kontrollera att sajten är uppdaterad
        run: |
          sleep 120
          missing=$(grep -o '<loc>[^<]*' sitemap.xml | sed 's/<loc>//' | while read u; do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$u")" = 200 ] || echo "$u"; done)
          if [ -z "$missing" ]; then echo "Alla sidor svarar."; exit 0; fi
          echo "Svarar inte: $missing"
          git pull -q --rebase
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --allow-empty -m "Bygg om: sidor saknades på sajten"
          git push
